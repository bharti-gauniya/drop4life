<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drop4Life - Admin Login</title>
<style>
    /* RESET */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', sans-serif;
    }

    /* BODY */
    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
    url("https://images.unsplash.com/photo-1615461066841-6116e61058f4");
    background-size: cover;
    color: white;
        background-position: center;
    }

    /* CONTAINER */
    .container {
        width: 700px;

        padding: 30px;
        border-radius: 15px;
        text-align: center;
        color: white;
        backdrop-filter: blur(10px);
        box-shadow: 0 0 25px rgba(255,0,0,0.6);
    }

    /* HEADING */
    .container h2 {
        margin-bottom: 20px;
        color: #ff4d4d;
    }

    /* INPUTS */
    input {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border: none;
        border-radius: 8px;
        outline: none;
    }

    /* BUTTON */
    button {
        width: 100%;
        padding: 10px;
        background: #ff1a1a;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.3s;
        font-weight: bold;
    }

    /* HOVER EFFECT */
    button:hover {
        background: #cc0000;
        transform: scale(1.05);
    }

    /* ERROR MESSAGE */
    #error {
        display: none;
        color: #ff8080;
        margin-top: 10px;
    }

    /* BACK LINK */
    .back {
        display: block;
        margin-top: 15px;
        color: #ccc;
        text-decoration: none;
        transition: 0.3s;
    }

    .back:hover {
        color: white;
    }
</style>

</head>

<body>
<div class="container">
    <h2>Admin Login</h2>

    <form action="admin_login.php" method="POST" onsubmit="return validateLogin()">

        <input type="text" id="username" name="username" placeholder="Username">

        <input type="password" id="password" name="password" placeholder="Password">

        <button type="submit">Login</button>

        <div id="error">⚠ Please fill all fields!</div>

    </form>

    <a href="index.html" class="back">← Back to Home</a>
</div>

<script>
    function validateLogin() {
        let user = document.getElementById("username").value.trim();
        let pass = document.getElementById("password").value.trim();

        if(user === "" || pass === "") {
            document.getElementById("error").style.display = "block";
            return false;
        }

        return true;
    }
</script>
